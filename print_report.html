<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานการแลกภาระงาน - Sangkhlaburi Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/webp" href="assets/hspmbz60021e231028112004.webp">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .print-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1b4332;
            padding-bottom: 15px;
        }

        .print-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .print-title h1 {
            font-size: 20px;
            margin: 0;
            color: #1b4332;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .print-title p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #64748b;
        }

        .print-actions {
            display: flex;
            gap: 10px;
        }

        .print-actions button {
            background-color: #1b4332;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(27, 67, 50, 0.15);
            transition: background-color 0.2s, transform 0.1s;
        }

        .print-actions button:hover {
            background-color: #2d6a4f;
            transform: translateY(-1px);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background-color: #1b4332;
            color: #ffffff;
            border: 1px solid #1b4332;
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        td {
            border: 1px solid #cbd5e1;
            padding: 12px 14px;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        /* Column Specific Styling */
        .swap-people-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .person-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-badge {
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .role-badge.req {
            background: #e0f2fe;
            color: #0284c7;
        }

        .role-badge.ptr {
            background: #fef3c7;
            color: #b45309;
        }

        .person-name {
            color: #1b4332;
            font-size: 13.5px;
            font-weight: 600;
        }

        .duty-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 8px;
        }

        .duty-before {
            background: #fef2f2;
            border: 1px dashed #fca5a5;
        }

        .duty-after {
            background: #f0fdf4;
            border: 1px solid #86efac;
        }

        .duty-item-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .duty-owner-name {
            font-weight: 600;
            color: #334155;
            min-width: 70px;
        }

        .duty-badge-pill {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .duty-badge-pill.shift-m {
            background: #fff5c5;
            color: #b7791f;
        }

        .duty-badge-pill.shift-a {
            background: #ffe3ec;
            color: #d53f8c;
        }

        .duty-badge-pill.shift-n {
            background: #e0f2fe;
            color: #2b6cb0;
        }

        .duty-badge-pill.shift-off {
            background: #ffffff;
            color: #64748b;
            border: 1px solid #cbd5e1;
        }

        .approver-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .admin-name-tag {
            font-weight: 700;
            color: #1b4332;
            font-size: 13px;
        }

        .approved-status-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #2d6a4f;
            background: #d8f3dc;
            padding: 2px 8px;
            border-radius: 8px;
            width: fit-content;
        }

        .approved-time {
            font-size: 10px;
            color: #64748b;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 40px;
            font-size: 14px;
        }

        @media print {
            .print-actions {
                display: none !important;
            }
            body {
                padding: 0;
            }
            .print-header {
                border-bottom: 2px solid #000000;
            }
            th {
                background-color: #f1f5f9 !important;
                color: #000000 !important;
                border: 1px solid #000000 !important;
            }
            td {
                border: 1px solid #000000 !important;
            }
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="print-header">
        <div class="print-title">
            <img src="assets/hspmbz60021e231028112004.webp" alt="Sangkhlaburi Hospital Logo" style="width: 48px; height: 48px; object-fit: contain; border-radius: 50%;">
            <div>
                <h1 style="margin: 0;"><i class="fa-solid fa-file-contract"></i> รายงานการแลกภาระงานของพนักงาน</h1>
                <p style="margin: 4px 0 0 0;">โรงพยาบาลสังขละบุรี — แสดงเฉพาะรายการที่ได้รับการอนุมัติจากผู้ดูแลระบบเรียบร้อยแล้ว</p>
            </div>
        </div>
        <div class="print-actions">
            <button onclick="window.print()"><i class="fa-solid fa-print"></i> พิมพ์เอกสาร</button>
            <button onclick="downloadReportAsJpg()" style="background-color: #2d6a4f;"><i class="fa-solid fa-file-image"></i> ดาวน์โหลดภาพ (JPG)</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="22%">1. ผู้ขอ - ผู้แลก</th>
                    <th width="32%">2. ภาระงานก่อน (ภาระงานก่อนแลก)</th>
                    <th width="32%">3. ภาระงานหลัง (ภาระงานหลังแลก)</th>
                    <th width="14%">4. ผู้อนุมัติ</th>
                </tr>
            </thead>
            <tbody id="report-table-tbody">
                <!-- Populated dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const storedRequests = localStorage.getItem('sukho_swap_requests');
            const tbody = document.getElementById('report-table-tbody');

            if (!storedRequests) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">ไม่พบข้อมูลการแลกภาระงานในระบบ</td></tr>`;
                return;
            }

            const requests = JSON.parse(storedRequests);
            const approvedRequests = requests.filter(r => r.status === 'approved');

            if (approvedRequests.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">ยังไม่มีข้อมูลการแลกภาระงานที่ได้รับการอนุมัติ</td></tr>`;
                return;
            }

            const formatDuty = (nurseName, day, shiftType, room) => {
                let shiftText = '';
                let badgeClass = 'shift-m';
                if (shiftType === 'ช') { shiftText = 'เวรเช้า (ช)'; badgeClass = 'shift-m'; }
                else if (shiftType === 'บ') { shiftText = 'เวรบ่าย (บ)'; badgeClass = 'shift-a'; }
                else if (shiftType === 'ด') { shiftText = 'เวรดึก (ด)'; badgeClass = 'shift-n'; }
                else { shiftText = 'วันหยุด (Off)'; badgeClass = 'shift-off'; }

                const roomText = (shiftType !== 'Off' && room && room !== 'Off') ? ` (${room})` : '';
                return `
                    <div class="duty-item-row">
                        <span class="duty-owner-name">${nurseName}:</span>
                        <span class="duty-badge-pill ${badgeClass}">วันที่ ${day} พ.ย. - ${shiftText}${roomText}</span>
                    </div>
                `;
            };

            tbody.innerHTML = '';
            approvedRequests.forEach(req => {
                const tr = document.createElement('tr');

                // 1. ผู้ขอ - ผู้แลก
                const tdPeople = document.createElement('td');
                tdPeople.innerHTML = `
                    <div class="swap-people-box">
                        <div class="person-row">
                            <span class="role-badge req">ผู้ขอ</span>
                            <span class="person-name">${req.requesterName}</span>
                        </div>
                        <div class="person-row">
                            <span class="role-badge ptr">ผู้แลก</span>
                            <span class="person-name">${req.partnerName}</span>
                        </div>
                    </div>
                `;
                tr.appendChild(tdPeople);

                // 2. ภาระงานก่อน
                const tdBefore = document.createElement('td');
                tdBefore.innerHTML = `
                    <div class="duty-box duty-before">
                        ${formatDuty(req.requesterName, req.myDay, req.myShiftType, req.myRoom)}
                        ${formatDuty(req.partnerName, req.partnerDay, req.partnerShiftType, req.partnerRoom)}
                    </div>
                `;
                tr.appendChild(tdBefore);

                // 3. ภาระงานหลัง
                const tdAfter = document.createElement('td');
                tdAfter.innerHTML = `
                    <div class="duty-box duty-after">
                        ${formatDuty(req.requesterName, req.partnerDay, req.partnerShiftType, req.partnerRoom)}
                        ${formatDuty(req.partnerName, req.myDay, req.myShiftType, req.myRoom)}
                    </div>
                `;
                tr.appendChild(tdAfter);

                // 4. ผู้อนุมัติ
                const tdAdmin = document.createElement('td');
                const time = req.approvedAt || req.timestamp || '';
                tdAdmin.innerHTML = `
                    <div class="approver-box">
                        <span class="admin-name-tag"><i class="fa-solid fa-user-shield"></i> ${req.admin}</span>
                        <span class="approved-status-chip"><i class="fa-solid fa-check-circle"></i> อนุมัติเรียบร้อย</span>
                        ${time ? `<div class="approved-time">${time}</div>` : ''}
                    </div>
                `;
                tr.appendChild(tdAdmin);

                tbody.appendChild(tr);
            });
        });

        function downloadReportAsJpg() {
            const container = document.querySelector('.table-container');
            if (!container) return;

            const originalOverflow = container.style.overflow;
            container.style.overflow = 'visible';

            html2canvas(container, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true
            }).then(canvas => {
                container.style.overflow = originalOverflow;
                const link = document.createElement('a');
                const now = new Date();
                const dateStr = `${now.getDate()}-${now.getMonth()+1}-${now.getFullYear()+543}`;
                link.download = `รายงานการแลกเวร-${dateStr}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            }).catch(err => {
                container.style.overflow = originalOverflow;
                alert('เกิดข้อผิดพลาดในการดาวน์โหลดรูปภาพ');
                console.error(err);
            });
        }
    </script>
</body>
</html>
